<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Beer bottle -->
  <g transform="translate(256,280)">
    <rect x="-30" y="-100" width="60" height="120" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <rect x="-18" y="-140" width="36" height="45" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <rect x="-25" y="-150" width="50" height="15" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <!-- Label -->
    <rect x="-26" y="-40" width="52" height="50" rx="4" fill="white" opacity="0.9"/>
    <text x="0" y="-25" text-anchor="middle" font-size="10" font-family="Arial" fill="#1e40af" font-weight="bold">GEST</text>
    <text x="0" y="-12" text-anchor="middle" font-size="12" font-family="Arial" fill="#1e40af" font-weight="bold">STOCK</text>
  </g>
  <!-- Crate -->
  <g transform="translate(160,380)">
    <rect x="-60" y="-30" width="120" height="30" rx="5" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <line x1="-50" y1="-30" x2="-50" y2="0" stroke="#451a03" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="-20" y2="0" stroke="#451a03" stroke-width="2"/>
    <line x1="10" y1="-30" x2="10" y2="0" stroke="#451a03" stroke-width="2"/>
    <line x1="40" y1="-30" x2="40" y2="0" stroke="#451a03" stroke-width="2"/>
  </g>
  <!-- Package on right -->
  <g transform="translate(360,360)">
    <rect x="-40" y="-25" width="80" height="25" rx="4" fill="#059669" stroke="#047857" stroke-width="3"/>
    <text x="0" y="-7" text-anchor="middle" font-size="14" fill="white" font-family="Arial" font-weight="bold">📦</text>
  </g>
</svg>